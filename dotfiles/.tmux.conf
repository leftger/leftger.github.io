# ==============================================================================
# Gerzain's Tmux Configuration
# ==============================================================================

# Enable mouse support (clicking panes, scrolling, resizing)
set -g mouse on

# Terminal & Colors (TrueColor / 256 color support)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Increase history scrollback buffer
set -g history-limit 10000

# Faster escape key response (vital for Vim inside Tmux)
set -s escape-time 10

# Vi mode keys in copy mode
setw -g mode-keys vi

# Start window and pane numbering at 1 (more ergonomic on keyboards)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar styling (minimal dark aesthetic)
set -g status-style "bg=#161b22,fg=#c9d1d9"
set -g status-left-length 40
set -g status-left "#[fg=#e05d44,bold] #S #[fg=#30363d]│ "
set -g status-right "#[fg=#8b949e]%Y-%m-%d #[fg=#30363d]│ #[fg=#f0f6fc,bold]%H:%M "
set -g window-status-current-style "fg=#f0f6fc,bold,bg=#21262d"
set -g window-status-current-format " #I:#W#F "
set -g window-status-format " #I:#W#F "

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
